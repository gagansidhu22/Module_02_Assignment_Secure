name: AppScan CodeSweep

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  codesweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run AppScan CodeSweep
        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v1
        id: codesweep
        with:
          status: true
          output-format: sarif
          # Optional: scan specific file types
          # include: "**/*.js,**/*.ts,**/*.py"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}

      - name: Debug SARIF
        run: |
          SARIF_FILE="AppScanCodeSweep/sarif/output.sarif"
          if [ -f "$SARIF_FILE" ]; then
            echo "SARIF file exists. Showing first 50 lines:"
            head -n 50 $SARIF_FILE
          else
            echo "SARIF file not found!"
          fi

      - name: Show CodeSweep results in Actions
        run: |
          SARIF_FILE="AppScanCodeSweep/sarif/output.sarif"
          if [ -f "$SARIF_FILE" ]; then
            RESULTS_COUNT=$(jq '.runs[].results | length' $SARIF_FILE)
            if [ "$RESULTS_COUNT" -gt 0 ]; then
              echo "## AppScan CodeSweep Results" >> $GITHUB_STEP_SUMMARY
              echo "| Severity | Message | File |" >> $GITHUB_STEP_SUMMARY
              echo "|---------|---------|------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.runs[].results[] | "| \(.level) | \(.message.text) | \(.locations[0].physicalLocation.artifactLocation.uri) |"' $SARIF_FILE >> $GITHUB_STEP_SUMMARY
            else
              echo "No issues found by CodeSweep." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "SARIF file not found!" >> $GITHUB_STEP_SUMMARY
